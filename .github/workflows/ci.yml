name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      # Actions pinned by commit SHA (tags are mutable).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain info
        run: |
          xcode-select -p
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: make test

      - name: Assemble app bundle
        run: make app

      - name: Verify code signature
        run: codesign --verify --verbose dist/MDReader.app

      - name: Zip app
        run: ditto -c -k --keepParent dist/MDReader.app MDReader.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MDReader.app
          path: MDReader.zip
